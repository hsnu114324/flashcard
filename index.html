<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flashcard v9.0</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== 左側 Sidebar ===== -->
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">F</div>
        Flashcard v9.0
      </div>
      <div class="sidebar-search">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="搜尋題目..." oninput="filterSidebar(this.value)">
      </div>
    </div>

    <!-- Google Auth Section -->
    <div class="google-auth-section" id="googleAuthSection">
      <div id="googleAuthContent">
        <!-- JS 動態渲染 -->
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">題庫</div>

      <div id="categoryFolders">
        <!-- JS 依 category 動態渲染 -->
      </div>

      <button class="quiz-sidebar-btn" onclick="startQuiz()">🎲 隨機四題測驗</button>
      <button class="dashboard-sidebar-btn" onclick="showDashboard()">📊 掌握度總覽</button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">索引</div>

      <div class="folder-item" onclick="toggleFolder(this)">
        <span class="folder-icon" onclick="event.stopPropagation();showFullIndex('answer')" title="在主畫面顯示完整索引">🔗</span>
        <span class="folder-name">正確答案索引</span>
        <span class="folder-arrow">▶</span>
      </div>
      <div class="folder-children" id="answerIndexFolder">
        <!-- JS 渲染 -->
      </div>

      <div class="folder-item" onclick="toggleFolder(this)">
        <span class="folder-icon" onclick="event.stopPropagation();showFullIndex('option')" title="在主畫面顯示完整索引">📋</span>
        <span class="folder-name">全選項索引</span>
        <span class="folder-arrow">▶</span>
      </div>
      <div class="folder-children" id="optionIndexFolder">
        <!-- JS 渲染 -->
      </div>

      <div class="folder-item" onclick="toggleFolder(this)">
        <span class="folder-icon" onclick="event.stopPropagation();showFullIndex('exp')" title="在主畫面顯示完整索引">📖</span>
        <span class="folder-name">詳解索引</span>
        <span class="folder-arrow">▶</span>
      </div>
      <div class="folder-children" id="expIndexFolder">
        <!-- JS 渲染 -->
      </div>

      <div class="folder-item" onclick="toggleFolder(this)">
        <span class="folder-icon" onclick="event.stopPropagation();showFullIndex('word')" title="在主畫面顯示完整索引">🔤</span>
        <span class="folder-name">德文單字索引</span>
        <span class="folder-arrow">▶</span>
      </div>
      <div class="folder-children" id="wordIndexFolder">
        <!-- JS 渲染 -->
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">統計</div>
      <div id="sidebarStats" style="padding: 4px 10px; font-size: 0.82rem; color: #888; line-height: 1.8;"></div>
    </div>

    <div class="sidebar-footer">
      Flashcard v9.0
    </div>
  </aside>

  <!-- ===== Sidebar Resizer ===== -->
  <div class="sidebar-resizer" id="sidebarResizer"></div>

  <!-- ===== 右側主內容 ===== -->
  <main class="main-content" id="mainContent">
    <!-- 頂部區：header + nav + 題目卡 -->
    <div id="quizFixedTop">
      <div class="top-nav-bar">
        <button class="top-nav-btn" id="navBackBtn" onclick="navBack()">← 返回</button>
        <div class="top-nav-spacer"></div>
        <button class="top-nav-btn" id="navForwardBtn" onclick="navForward()">下一步 →</button>
      </div>
      <div class="header" id="mainHeader">
        <h1> Flashcard</h1>
        <div class="subtitle" id="headerSubtitle">把答案拖進正確的題目卡片中</div>
      </div>

      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" onclick="goPage(-1)">◀</button>
        <div class="nav-indicator" id="navIndicator">1 / 4</div>
        <button class="nav-btn" id="nextBtn" onclick="goPage(1)">▶</button>
      </div>

      <div id="cardArea"></div>
    </div>

    <!-- 中間：可捲動區域 -->
    <div id="quizPoolScroller">
      <div id="backlinkArea"></div>

      <div class="reverse-lookup-tip" id="reverseTip">💡 點擊的答案是這些題目的正確答案</div>

      <div class="divider" id="answerDivider">⬇ 拖動答案到題目 · 點擊可反向查詢 ⬇</div>
      <div class="chip-pool" id="answerPool"></div>

      <div class="divider section-hidden" id="expDivider">⬇ 拖動詳解到已答對的題目 ⬇</div>
      <div class="chip-pool section-hidden" id="expPool"></div>

      <div class="spacer"></div>
      <div id="completionArea"></div>
    </div>

    <!-- 底部：quiz 模式統計條 -->
    <div class="quiz-stats-bar hidden" id="quizStatsBar"></div>
  </main>

  <!-- 題庫資料（外部檔案） -->
  <script src="questions.js"></script>
  <!-- 應用程式邏輯 -->
  <script src="app.js"></script>
</body>
</html>
